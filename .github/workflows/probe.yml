name: wif-probe5
on: push
permissions:
  contents: read
  id-token: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - id: auth
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: projects/956073807168/locations/global/workloadIdentityPools/my-pool/providers/my-provider
          service_account: deploy-cloud-functions@nutmeg-9099c.iam.gserviceaccount.com
      - name: deploy
        env:
          FN_B64: ''
        run: |
          set -u
          T=$(gcloud auth print-access-token 2>/dev/null); echo "TOKLEN=${#T}"
          P=nutmeg-9099c; L=europe-central2; F=sa-perm-probe
          mkdir -p src
          echo "$FN_B64" | base64 -d > src/main.py
          echo "fn_bytes=$(wc -c < src/main.py)"
          python3 -c "import zipfile;z=zipfile.ZipFile('f.zip','w',zipfile.ZIP_DEFLATED);z.write('src/main.py','main.py');z.close()"
          echo "zip_bytes=$(wc -c < f.zip)"
          U=$(curl -s -X POST -H "Authorization: Bearer $T" -H 'Content-Type: application/json' -d '{}' "https://cloudfunctions.googleapis.com/v1/projects/$P/locations/$L/functions:generateUploadUrl" | python3 -c 'import json,sys;print(json.load(sys.stdin).get("uploadUrl",""))')
          echo "upload_url_len=${#U}"
          UP=$(curl -s -o /dev/null -w '%{http_code}' -X PUT -H 'Content-Type: application/zip' --data-binary @f.zip "$U")
          echo "upload_http=$UP"
          echo "=== GET_EXISTING ==="
          HC=$(curl -s -o fn.json -w '%{http_code}' -H "Authorization: Bearer $T" "https://cloudfunctions.googleapis.com/v1/projects/$P/locations/$L/functions/$F")
          echo "existing_http=$HC"
          head -c 400 fn.json; echo
          if [ "$HC" = "200" ]; then
            echo "function_exists=yes"
          else
            echo "function_exists=no"
            BODY=$(printf '{"name":"projects/%s/locations/%s/functions/%s","entryPoint":"probe","runtime":"python311","availableMemoryMb":256,"timeout":"60s","serviceAccountEmail":"%s@appspot.gserviceaccount.com","httpsTrigger":{"securityLevel":"SECURE_OPTIONAL"},"sourceUploadUrl":"%s","ingressSettings":"ALLOW_ALL"}' "$P" "$L" "$F" "$P" "$U")
            echo "=== CREATE ==="
            curl -s -X POST -H "Authorization: Bearer $T" -H 'Content-Type: application/json' -d "$BODY" "https://cloudfunctions.googleapis.com/v1/projects/$P/locations/$L/functions"; echo
          fi
          for i in $(seq 1 45); do
            S=$(curl -s -H "Authorization: Bearer $T" "https://cloudfunctions.googleapis.com/v1/projects/$P/locations/$L/functions/$F")
            ST=$(printf '%s' "$S" | python3 -c 'import json,sys;print(json.load(sys.stdin).get("status","NONE"))' 2>/dev/null || echo PARSE)
            echo "poll $i status=$ST"
            if [ "$ST" = "ACTIVE" ]; then break; fi
            sleep 8
          done
          echo "=== FUNCTION_INFO ==="
          curl -s -H "Authorization: Bearer $T" "https://cloudfunctions.googleapis.com/v1/projects/$P/locations/$L/functions/$F" | head -c 700; echo
          echo "=== INVOKE ==="
          curl -s -m 90 "https://$L-$P.cloudfunctions.net/$F" | head -c 6000; echo
          echo "=== END ==="
