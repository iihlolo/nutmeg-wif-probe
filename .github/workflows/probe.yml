name: wif-probe5
on: push
permissions:
  contents: read
  id-token: write
jobs:
  appspot:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.probe.outputs.ok }}
    steps:
      - uses: actions/checkout@v4
      - id: auth
        continue-on-error: true
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: projects/956073807168/locations/global/workloadIdentityPools/my-pool/providers/my-provider
          service_account: nutmeg-9099c@appspot.gserviceaccount.com
      - id: probe
        continue-on-error: true
        env:
          TOPIC: gpu-hunt-i8036-5e7d2b
        run: |
          set -u
          T=$(gcloud auth print-access-token 2>/dev/null || true)
          echo "APPSPOT_TOKLEN=${#T}"
          if [ "${#T}" -ge 100 ]; then
            python3 probe_core.py --as appspot --token "$T" --topic "$TOPIC" --label appspot-wif
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "APPSPOT_WIF_AUTH_FAILED"
            echo "ok=0" >> "$GITHUB_OUTPUT"
          fi
  fbadmin:
    runs-on: ubuntu-latest
    needs: appspot
    if: ${{ always() && needs.appspot.outputs.ok != '1' }}
    steps:
      - uses: actions/checkout@v4
      - id: auth
        continue-on-error: true
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: projects/956073807168/locations/global/workloadIdentityPools/my-pool/providers/my-provider
          service_account: firebase-adminsdk-ozsy6@nutmeg-9099c.iam.gserviceaccount.com
      - env:
          TOPIC: gpu-hunt-i8036-5e7d2b
        continue-on-error: true
        run: |
          set -u
          T=$(gcloud auth print-access-token 2>/dev/null || true)
          echo "FB_TOKLEN=${#T}"
          if [ "${#T}" -ge 100 ]; then
            python3 probe_core.py --as firebase --token "$T" --topic "$TOPIC" --label firebase-wif
          else
            echo "FB_WIF_AUTH_FAILED"
          fi
  cloudbuild:
    runs-on: ubuntu-latest
    needs:
      - appspot
      - fbadmin
    if: ${{ always() && needs.appspot.outputs.ok != '1' }}
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: projects/956073807168/locations/global/workloadIdentityPools/my-pool/providers/my-provider
          service_account: deploy-cloud-functions@nutmeg-9099c.iam.gserviceaccount.com
      - env:
          TOPIC: gpu-hunt-i8036-5e7d2b
        run: python3 build_trigger.py --topic "$TOPIC"
